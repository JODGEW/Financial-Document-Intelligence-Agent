name: comparison-regression

# Controlled, credential-free regression gate for the Item 1A comparison
# workflow. No repository secrets, no AWS credentials, no Bedrock, no network
# access to model providers: the suite runs entirely over synthetic fixtures in
# temporary directories.
#
# No path filters on purpose. Comparison behavior can change from the detector,
# validators, schemas, filing registry, ingestion section metadata, comparison
# store, governance policy, review logic, export logic, labels, fixtures, the
# evaluator, or a dependency bump — a filter narrow enough to be useful would
# be wrong the first time one of those moves, so this job always runs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: comparison-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparison-regression:
    name: comparison-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comparison regression suite (gates enforced)
        run: python scripts/eval_comparison_regression.py --report comparison-regression-report.json

      # Every suite here is credential-free and offline. The Stage 3.5
      # reliability suites are included deliberately: this job is the only
      # merge-blocking required check, so a suite it does not run is a suite
      # that cannot block a regression. tests/test_comparison_reliability.py is
      # pinned to this list by a test in that file, which parses this workflow.
      # tests/conftest.py derives the deterministic test-only signing secret
      # inside pytest; no repository secret or runtime credential is injected.
      - name: Offline comparison test suites
        run: |
          python -m pytest -q \
            tests/test_comparison_regression.py \
            tests/test_comparison_detector.py \
            tests/test_item1a_unit_parser_v3.py \
            tests/test_comparison_validators.py \
            tests/test_comparison_schema.py \
            tests/test_comparison_store.py \
            tests/test_comparison_governance.py \
            tests/test_comparison_review.py \
            tests/test_comparison_export.py \
            tests/test_comparison_detection_attempts.py \
            tests/test_comparison_detection_jobs.py \
            tests/test_comparison_detection_job_leases.py \
            tests/test_comparison_detection_job_retries.py \
            tests/test_detection_recovery.py \
            tests/test_comparison_reliability.py \
            tests/test_access_control.py \
            tests/test_api.py \
            tests/test_api_errors.py

      # Bounded Chroma upserts. Ingestion is upstream of every comparison: if
      # a write silently exceeded the client batch limit, or the filing
      # registry claimed a complete ingestion that a failed batch never
      # delivered, the detector would compare a partially indexed section. The
      # suite is offline — a recording fake store plus a local Chroma with a
      # deterministic stub embedding function, no AWS and no network — and is
      # pinned to this list by a test inside it.
      - name: Bounded Chroma upsert suite
        run: python -m pytest -q tests/test_chroma_batching.py

      # Process-level fault injection: real OS processes, real SIGKILL, real
      # SQLite lock contention. Included in the required check rather than a
      # separate manual workflow because it is deterministic and bounded —
      # roughly 80 seconds locally, well inside this job's 20-minute budget.
      # Every case here is credential-free: temporary directories, controlled
      # fixtures, an ephemeral localhost port, and child environments whose
      # provider variables are explicitly neutralized. No case sleeps for a
      # real lease to elapse; expiry is crossed with a checked short policy or
      # an injected clock. There is no extended-only matrix: splitting these
      # would leave the merge-blocking core unable to catch exactly the
      # regressions this suite exists to catch.
      - name: Process-level fault injection suite
        run: python -m pytest -q tests/test_runtime_fault_injection.py

      # Real-filing benchmark INFRASTRUCTURE only: manifest and annotation
      # schemas, mocked-HTTP acquisition, corpus build over tiny synthetic HTML
      # fixtures, SEC-style Item heading extraction, and evaluator refusal/
      # metric behavior. Deliberately offline — this job never contacts SEC
      # EDGAR, never supplies a user agent, and never downloads a filing.
      # Corpus acquisition is an explicit, manually invoked external-network
      # operation documented in BENCHMARK.md, and it is not a substitute for
      # this merge-blocking offline validation.
      #
      # test_sec_html_item_extraction.py gates the section boundary the whole
      # comparison path depends on: a heading-recognition regression would
      # silently change which text is compared, so it belongs in the required
      # check rather than beside it. Its fixtures are hand-written generic HTML
      # structures — no real filing content exists in the repository.
      # The holdout suites validate the frozen holdout corpus
      # (benchmarks/real_filing_holdout_v1), now at corpus_built:
      # deterministic selection over mocked official metadata, the frozen
      # manifest's schema and denials (no human-verified annotation, no
      # generalization claim), the closed metadata-endpoint allowlist that
      # made filing bodies structurally unreachable during selection,
      # mocked-transport acquisition behavior (frozen-identity drift refused,
      # canonical official URLs only, digests over decoded bytes, one failed
      # side blocks the transition), and — since the blind extraction step —
      # the blind-run pipeline over synthetic fixtures (all twenty sides
      # attempted exactly once under byte-identical frozen code, outcomes
      # preserved, comparison only for fully extracted pairs, packets only
      # for detected pairs, everything machine_proposed) plus the committed
      # blind-extraction reports and their manifest hash chain. CI validates
      # the committed artifacts; it never rebuilds the real holdout corpus.
      # Offline like the rest: CI never contacts SEC EDGAR, never supplies a
      # user agent, and never downloads a filing body.
      # test_holdout_human_annotation_validation.py freezes the human-review
      # admission contract (scripts/validate_holdout_human_annotations.py):
      # the nine review-ready pairs, the one extraction-ambiguous pair, every
      # recorded identity and hash chain, exactly-once unit-id closure, and
      # read-only behavior — entirely over synthetic fixtures, before any
      # human label exists.
      # test_gold_evaluation_signoff.py freezes the generalization sign-off
      # admission contract: an affirmative claim now requires an explicit,
      # non-empty, bounded statement a person wrote, on top of every condition
      # that already applied. It also pins the committed gold evaluation as
      # byte-identical, unsigned, and generalization_claim_supported=false, so
      # hardening the future gate cannot quietly revalue the frozen one.
      # test_v3_gold_evaluator_contract.py freezes the contract-v2 gold
      # evaluator (real-filing-benchmark.evaluation.v2 + metrics.v2): future
      # v3-detector evaluations match by exact canonical sequence-aware unit
      # identity, repeated normalized headings stay separate metric subjects,
      # duplicate subjects and unclosed inventories refuse before any metric,
      # the frozen contract-v1 evaluation stays identifiable, and neither
      # contract silently accepts the other's artifacts — all over synthetic
      # fixtures, before any new holdout exists.
      - name: Offline real-filing benchmark infrastructure suite
        run: |
          python -m pytest -q \
            tests/test_real_filing_benchmark_schema.py \
            tests/test_real_filing_benchmark_tools.py \
            tests/test_real_filing_benchmark_evaluator.py \
            tests/test_sec_html_item_extraction.py \
            tests/test_real_filing_holdout_selection.py \
            tests/test_real_filing_holdout_manifest.py \
            tests/test_real_filing_holdout_acquisition.py \
            tests/test_real_filing_holdout_source_verification.py \
            tests/test_real_filing_holdout_blind_extraction.py \
            tests/test_real_filing_holdout_build_report.py \
            tests/test_holdout_human_annotation_validation.py \
            tests/test_real_filing_holdout_gold_evaluation.py \
            tests/test_gold_evaluation_signoff.py \
            tests/test_v3_gold_evaluator_contract.py

      # Metrics, denominators, gate results, and version/fixture hashes only.
      # The report carries no source filing text, no evidence excerpts, no
      # reviewer notes, no database files, and no filesystem paths.
      - name: Upload metric report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-regression-report
          path: comparison-regression-report.json
          if-no-files-found: warn
