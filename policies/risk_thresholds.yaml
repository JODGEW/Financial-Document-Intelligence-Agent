# Risk scorer configuration for the governance layer.
#
# Governance as policy, not code: the risk score and its bucketing live here, not
# hard-coded in risk_scorer.py. Edit these numbers to retune risk without a code
# change. If this file is missing, risk_scorer.py falls back to identical defaults
# so the agent still runs.
#
# risk_score is "badness" in 0..1 (higher = riskier). The score is a weighted sum
# of three signals, each mapped to a 0..1 risk contribution:
#   - grounding:  1 - grounding_score        (a poorly grounded answer is risky)
#   - guardrail:  blocked=1.0, anonymized=0.5, passed=0.0
#   - external:   external_context_used ? 1.0 : 0.0
risk_thresholds:
  # Bands: risk < auto_return_below -> low; risk >= require_review_at_or_above
  # -> high (human review); everything between the two -> medium, returned
  # with a warning.
  auto_return_below: 0.50
  require_review_at_or_above: 0.75
  # Mandatory-review floor, separate from the weighted score above: an answer
  # that PRESENTS an internal corpus answer and whose grounding_score is
  # STRICTLY below this is held for human review even when its weighted risk
  # score stays under require_review_at_or_above. The trigger is reported as
  # the explicit reason grounding_below_review_floor; the displayed risk
  # score/level are never adjusted to force the hold. Answers whose internal
  # corpus answer is unavailable (refusals, web fallbacks) are not judged by
  # the floor — they have no internal claims to ground.
  require_review_below_grounding: 0.50

signal_weights:
  grounding_score_weight: 0.5
  guardrail_outcome_weight: 0.3
  external_context_weight: 0.2
